<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous" onload="window.dispatchEvent(new Event('oreo-math-ready'))"></script>
<title>oreo</title>
<link rel="icon" type="image/svg+xml" href="/oreo.svg">
<style>
  :root {
    --bg: #f6f1e7; --panel: #efe8da; --ink: #1d1a17; --muted: #7a7166;
    --line: #e2d9c8; --you: #1d1a17; --you-ink: #f6f1e7; --code: #ebe3d3; --accent: #1d1a17;
    --font: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210; --panel: #1b1916; --ink: #ece5d8; --muted: #8d8478;
      --line: #2a2723; --you: #ece5d8; --you-ink: #141210; --code: #211e1b; --accent: #ece5d8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }

  /* sidebar */
  aside { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--panel);
          border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; padding: 18px 18px 12px; font-weight: 700;
           letter-spacing: .02em; }
  .brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--ink);
             box-shadow: inset 0 0 0 3px var(--bg); }
  #new { margin: 0 12px 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
         text-align: left; }
  #new:hover, #chats a:hover { background: var(--line); }
  #chats { flex: 1; overflow-y: auto; padding: 0 8px; }
  #chats a { display: flex; align-items: center; padding: 6px 10px; border-radius: 6px; color: inherit;
             text-decoration: none; font-size: 14px; }
  #chats a span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #chats a.on { background: var(--line); }
  #chats a button { visibility: hidden; color: var(--muted); padding: 0 4px; }
  #chats a:hover button { visibility: visible; }
  .side-foot { padding: 12px 18px; font-size: 13px; color: var(--muted); }
  .side-foot button:hover { color: var(--ink); }

  /* main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 12px 20px; }
  header select { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  #log { flex: 1; overflow-y: auto; }
  .col { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .msg { margin: 22px 0; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .body { background: var(--you); color: var(--you-ink); padding: 10px 14px;
                    border-radius: 14px 14px 4px 14px; max-width: 85%; white-space: pre-wrap; }
  .chips { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta.err { color: #c0392b; }
  .empty { text-align: center; color: var(--muted); margin-top: 28vh; }
  .empty b { display: block; color: var(--ink); font-size: 22px; margin-bottom: 4px; }

  .md { min-width: 0; overflow-wrap: anywhere; line-height: 1.7; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md .table-scroll { margin: 0 0 14px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 22px 0 9px; line-height: 1.3; overflow-wrap: anywhere; }
  .md h1 { font-size: 1.45em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; } .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { padding-left: 24px; } .md li + li { margin-top: 5px; }
  .md li input[type="checkbox"] { width: 13px; height: 13px; margin: 0 5px 0 0; accent-color: var(--ink); vertical-align: -1px; }
  .md code { font: 13px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .md pre { position: relative; background: var(--code); border-radius: 8px; padding: 14px 52px 14px 14px; overflow-x: auto; max-width: 100%; }
  .md pre code { background: none; padding: 0; }
  .md pre button { position: absolute; top: 7px; right: 8px; font-size: 12px; color: var(--muted); }
  .md blockquote { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; color: var(--muted); }
  .md .table-scroll { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  .md table { border-collapse: collapse; min-width: 100%; font-size: 14px; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { font-weight: 600; background: var(--code); }
  .md .math-display { display: block; max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 8px 2px; text-align: center; }
  .md .math-inline { white-space: normal; }
  .md .katex { font-size: 1em; }
  .md a { color: inherit; text-underline-offset: 3px; }
  .md .citation { text-decoration: none; font-size: .78em; vertical-align: super; margin-left: 2px; color: var(--muted); }
  .md .citation:hover { text-decoration: underline; color: var(--ink); }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  @media (max-width: 600px) { .md { font-size: 15px; line-height: 1.68; } .md .math-display { text-align: left; } .md pre { padding: 42px 12px 12px; } }

  /* composer */
  form.compose { padding: 8px 0 20px; }
  .box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: 14px;
         background: var(--panel); padding: 8px 8px 8px 14px; }
  .box textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; max-height: 40vh;
                  padding: 4px 0; line-height: 1.5; }
  #send { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--bg);
          font-size: 16px; flex: none; }
  #send:disabled { opacity: .3; cursor: default; }
  .box { flex-wrap: wrap; }
  #tray { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  #tray:empty { display: none; }
  .file { display: flex; align-items: center; gap: 6px; font-size: 13px; background: var(--bg);
          border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 8px; max-width: 220px; }
  .file img { width: 26px; height: 26px; object-fit: cover; border-radius: 4px; margin-left: -4px; }
  .file span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .file button { color: var(--muted); padding: 0 4px; }
  #attach { width: 34px; height: 34px; border-radius: 10px; color: var(--muted); font-size: 20px; flex: none; }
  #attach:hover, #web:hover { color: var(--ink); background: var(--line); }
  #web { height: 34px; padding: 0 10px; border-radius: 10px; color: var(--ink); font-size: 13px; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
  #web.on { color: #111; background: #f0eee8; box-shadow: 0 0 0 2px #f0eee833; font-weight: 650; }
  #web:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #agent { height: 34px; padding: 0 10px; border-radius: 10px; color: var(--muted); font-size: 13px; flex: none; }
  #agent.on { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; }
  .sources a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .sources a:hover { color: var(--ink); }
  body.drop main::after { content: "Drop files to attach"; position: fixed; inset: 12px; display: grid;
          place-items: center; border: 2px dashed var(--muted); border-radius: 16px; background: var(--bg);
          opacity: .92; font-size: 18px; color: var(--muted); pointer-events: none; }
  .msg.user .imgs { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-bottom: 6px; }
  .msg.user .imgs img { max-width: 220px; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); }

  /* while Oreo thinks: a glowing audio wave dances and the label shimmers */
  .thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .wave { display: inline-flex; align-items: center; gap: 3px; height: 22px; filter: drop-shadow(0 0 6px #a78bfa88); }
  .wave i { width: 3px; height: 100%; border-radius: 3px; transform: scaleY(.2);
            background: linear-gradient(180deg, #22d3ee, #a78bfa 55%, #f472b6); animation: eq .9s ease-in-out infinite; }
  .wave i:nth-child(1) { animation-duration: .7s; animation-delay: -.3s; }
  .wave i:nth-child(2) { animation-duration: 1.1s; animation-delay: -.6s; }
  .wave i:nth-child(3) { animation-duration: .8s; animation-delay: -.1s; }
  .wave i:nth-child(4) { animation-duration: 1.3s; animation-delay: -.8s; }
  .wave i:nth-child(5) { animation-duration: .75s; animation-delay: -.45s; }
  .wave i:nth-child(6) { animation-duration: 1s; animation-delay: -.2s; }
  .wave i:nth-child(7) { animation-duration: .85s; animation-delay: -.7s; }
  .thinking .label { background: linear-gradient(90deg, var(--muted) 35%, var(--ink) 50%, var(--muted) 65%);
          background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
          animation: shimmer 1.6s linear infinite; }
  @keyframes eq { 0%, 100% { transform: scaleY(.18); } 30% { transform: scaleY(1); } 60% { transform: scaleY(.45); } 80% { transform: scaleY(.8); } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .streaming .md > :last-child::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 2px;
          vertical-align: -2px; background: var(--ink); border-radius: 1px; animation: blink 1s steps(2) infinite; }
  .streaming .md.streaming-plain { white-space: pre-wrap; overflow-wrap: anywhere; }
  .streaming .md > pre:last-child::after { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wave i, .thinking .label, .streaming .md > :last-child::after { animation: none; } }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

  /* settings */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink);
           width: min(460px, 92vw); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 14px; font-size: 17px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  dialog input, dialog select, dialog textarea { width: 100%; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 7px 10px; }
  dialog textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .actions .spacer { flex: 1; }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #usage-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .usage-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .usage-top b { color: var(--ink); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width .6s;
           background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); }
  #usage-detail { font-size: 12px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 1.2em; }
  #approval-dialog { width: min(760px, 94vw); max-height: 82vh; }
  #approval-title { margin-bottom: 4px; }
  #approval-summary { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  #approval-preview { max-height: 52vh; overflow: auto; white-space: pre; background: var(--panel); border: 1px solid var(--line);
                      border-radius: 8px; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .agent-activity { color: var(--muted); font-size: 12px; margin-top: 8px; }

  @media (max-width: 720px) { aside { display: none; } }
  .brand{letter-spacing:-.035em;font-weight:650}.brand img{display:block}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/oreo.svg" alt="" width="24" height="24">oreo</div>
  <button id="new">+ New chat</button>
  <nav id="chats"></nav>
  <div class="side-foot"><button id="who" title="Not you? Change name"></button><span id="owner-only" hidden> · <button id="open-settings">Settings</button></span></div>
</aside>

<main>
  <header><select id="model" title="Model for this chat"></select></header>
  <div id="log"><div class="col" id="msgs"></div></div>
  <form class="compose col" id="form">
    <div class="box">
      <div id="tray"></div>
      <button id="attach" type="button" title="Attach PDF, Word, text or images">+</button>
      <button id="web" type="button" title="Web search is on. Click to turn it off." aria-label="Web search on" aria-pressed="true">Web: On</button>
      <button id="agent" type="button" title="Let Oreo Code inspect and edit this project" hidden>Oreo Code</button>
      <input id="pick" type="file" multiple hidden accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.log,.c,.cpp,.h,.java,.go,.rs,.sh,.sql">
      <textarea id="input" rows="1" placeholder="Message Oreo" autofocus></textarea>
      <button id="send" type="submit" title="Send (Enter)">↑</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · drop or paste files<span id="file-hint" hidden> · @path attaches a file (sent once; @ it again if needed later)</span></div>
  </form>
</main>

<dialog id="hello">
  <form method="dialog" id="hello-form">
    <h2>Hi, I'm Oreo.</h2>
    <label for="hello-name">What's your name?</label>
    <input id="hello-name" maxlength="30" autocomplete="given-name" required>
    <div class="actions"><span class="spacer"></span><button class="btn primary">Start</button></div>
  </form>
</dialog>

<dialog id="settings">
  <h2>Settings</h2>
  <div id="usage-box"><div class="usage-top"><span>Usage this month</span><b id="usage">…</b></div>
    <div class="bar"><i id="usage-bar"></i></div><div id="usage-detail"></div></div>
  <label>API key</label>
  <input id="s-key" type="password" placeholder="saved in Keychain · paste to replace" autocomplete="off">
  <label>Default model</label>
  <select id="s-model"></select>
  <div class="row">
    <div><label>Temperature (0–2)</label><input id="s-temp" type="number" min="0" max="2" step="0.1"></div>
    <div><label>Reply length (tokens)</label><input id="s-max" type="number" min="64" step="256"></div>
    <div><label title="Chat history sent with each message; older turns become a short summary">Memory (tokens)</label><input id="s-ctx" type="number" min="200" step="250"></div>
  </div>
  <label>Instructions for every chat</label>
  <textarea id="s-instr" placeholder="e.g. I code in Python and C++; keep answers short."></textarea>
  <div id="status"></div>
  <div class="actions">
    <button class="btn" id="s-test" type="button">Test connection</button>
    <span class="spacer"></span>
    <button class="btn" id="s-close" type="button">Close</button>
    <button class="btn primary" id="s-save" type="button">Save</button>
  </div>
</dialog>

<dialog id="approval-dialog">
  <h2 id="approval-title">Review action</h2>
  <div id="approval-summary"></div>
  <pre id="approval-preview"></pre>
  <div class="actions">
    <button class="btn" id="approval-decline" type="button">Decline</button>
    <span class="spacer"></span>
    <button class="btn primary" id="approval-accept" type="button">Allow once</button>
  </div>
</dialog>

<script type="module">
import { markdown, typesetMath } from "/markdown.js";
const $ = s => document.querySelector(s);
const esc = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
let state = null, chatId = null, controller = null;

// ---------- api

let me = localStorage.getItem("oreo-name") || "";
const who = () => ({"X-Oreo-User": encodeURIComponent(me)});

async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: {...who(), ...(opts.body ? {"Content-Type": "application/json"} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

// ---------- rendering

function splitFiles(content) {
  const files = [];
  const text = content.replace(/\n\n<file path="([^"]*)">\n[\s\S]*?\n<\/file>/g, (_, p) => { files.push(p); return ""; });
  return {text, files};
}

function addMsg(role, content, meta, images = [], sources = []) {
  $(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "user") {
    const toolResult = content.match(/^<result tool="([\w-]+)">\n([\s\S]*?)\n<\/result>$/);
    if (toolResult) {
      el.className = "msg assistant";
      el.innerHTML = `<div class="agent-activity">Oreo Code · ${esc(toolResult[1].replaceAll("_", " "))}</div><div class="meta"></div>`;
      el.querySelector(".meta").textContent = toolResult[2].slice(0, 500);
      $("#msgs").appendChild(el);
      return el;
    }
    const {text, files} = splitFiles(content);
    el.innerHTML = (images.length ? `<div class="imgs">${images.map(src => `<img src="${esc(src)}" alt="">`).join("")}</div>` : "") +
      (text.trim() ? `<div class="body"></div>` : "") + (files.length ? `<div class="chips">attached ${files.map(esc).join(", ")}</div>` : "");
    if (text.trim()) el.querySelector(".body").textContent = text;
  } else {
    const toolCall = content.match(/<tool name="([\w-]+)">[\s\S]*?<\/tool>/);
    const visible = content.replace(/<tool name="[\w-]+">[\s\S]*?<\/tool>/, "").trim();
    el.innerHTML = `<div class="md">${markdown(visible, sources)}</div>` + (toolCall ? `<div class="agent-activity">Oreo Code · requested ${esc(toolCall[1].replaceAll("_", " "))}</div>` : "") + sourcesHtml(sources) + (meta ? `<div class="meta">${esc(meta)}</div>` : "");
    typesetMath(el.querySelector(".md"));
  }
  $("#msgs").appendChild(el);
  return el;
}

function showEmpty() {
  $("#msgs").innerHTML = `<div class="empty"><b>Hey ${esc(me.split(" ")[0])}.</b>What are we working on?</div>`;
}

const atBottom = () => { const l = $("#log"); return l.scrollHeight - l.scrollTop - l.clientHeight < 80; };
const scrollDown = () => { $("#log").scrollTop = $("#log").scrollHeight; };

async function loadChats() {
  const chats = await api("chats");
  $("#chats").innerHTML = "";
  for (const c of chats) {
    const a = document.createElement("a");
    a.href = "#" + c.id;
    a.className = c.id === chatId ? "on" : "";
    a.innerHTML = `<span></span><button title="Delete">×</button>`;
    a.querySelector("span").textContent = c.title;
    a.onclick = e => { e.preventDefault(); openChat(c.id); };
    a.querySelector("button").onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      if (!confirm(`Delete "${c.title}"?`)) return;
      await api("chats/" + c.id, {method: "DELETE"});
      if (c.id === chatId) newChat(); else loadChats();
    };
    $("#chats").appendChild(a);
  }
}

async function openChat(id) {
  if (controller) controller.abort();
  const c = await api("chats/" + id);
  chatId = id;
  history.replaceState(null, "", "#" + id);
  $("#msgs").innerHTML = "";
  for (const m of c.messages) addMsg(m.role, m.content, null, (m.images || []).filter(n => !n.endsWith(".pdf")).map(n => "/api/uploads/" + n), m.sources);
  if (!c.messages.length) showEmpty();
  scrollDown();
  loadChats();
  $("#input").focus();
}

function newChat() {
  if (controller) controller.abort();
  chatId = null;
  history.replaceState(null, "", location.pathname);
  showEmpty();
  loadChats();
  $("#input").focus();
}

// ---------- attachments

const MAX_FILE = 15e6;
let pending = [];   // [{name, type, data (base64), url (preview, images only)}]

function readFile(f) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.split(",")[1]);
    r.onerror = () => fail(r.error);
    r.readAsDataURL(f);
  });
}

async function addFiles(list) {
  if (agentOn) { alert("Turn off Oreo Code before attaching files."); return; }
  for (const f of list) {
    if (f.size > MAX_FILE) { alert(`${f.name} is over 15 MB`); continue; }
    const name = f.name || "pasted.png";
    pending.push({name, type: f.type, data: await readFile(f),
                  url: f.type.startsWith("image/") ? URL.createObjectURL(f) : null});
  }
  showTray();
}

function showTray() {
  $("#tray").innerHTML = "";
  pending.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "file";
    el.innerHTML = (p.url ? `<img src="${p.url}" alt="">` : "") + `<span></span><button type="button" title="Remove">×</button>`;
    el.querySelector("span").textContent = p.name;
    el.querySelector("button").onclick = () => { pending.splice(i, 1); showTray(); };
    $("#tray").appendChild(el);
  });
  updateSend();
}

function thinking(label) {
  return `<span class="thinking"><span class="wave">${"<i></i>".repeat(7)}</span><span class="label">${esc(label)}</span></span>`;
}
const QUIPS = ["thinking", "dunking in milk", "twisting the cookie", "tuning the frequencies",
               "consulting the cream filling", "warming up the neurons", "almost there"];

function sourcesHtml(list) {
  if (!list || !list.length) return "";
  const links = list.flatMap((s, i) => {
    try {
      const url = new URL(s.url);
      if (!['http:', 'https:'].includes(url.protocol)) return [];
      const host = url.hostname.replace(/^www\./, "");
      return [`<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer" title="${esc(s.title || url.href)}">${i + 1} · ${esc(host)}</a>`];
    } catch { return []; }
  });
  return links.length ? `<div class="sources">${links.join("")}</div>` : "";
}

// ---------- sending

function setBusy(busy) {
  $("#send").textContent = busy ? "■" : "↑";
  $("#send").title = busy ? "Stop" : "Send (Enter)";
  updateSend();
}
const updateSend = () => { $("#send").disabled = !controller && !$("#input").value.trim() && !pending.length; };

function reviewAgentAction(action) {
  const dialog = $("#approval-dialog"), signal = controller?.signal;
  const preview = action.preview || {}, name = action.name.replaceAll("_", " ");
  const target = preview.path || action.args.path || "";
  const detail = action.name === "run_command" ? (preview.command || action.args.command || "") : (preview.diff || preview.result || "");
  $("#approval-title").textContent = action.name === "run_command" ? "Run this command?" : `Review ${name}`;
  $("#approval-summary").textContent = target ? `${name} · ${target}` : name;
  $("#approval-preview").textContent = String(detail).slice(0, 16000) || "No preview available.";
  return new Promise(resolve => {
    let settled = false;
    const finish = approved => {
      if (settled) return;
      settled = true;
      signal?.removeEventListener("abort", abort);
      dialog.removeEventListener("cancel", cancel);
      if (dialog.open) dialog.close();
      resolve(approved);
    };
    const abort = () => finish(false);
    const cancel = event => { event.preventDefault(); finish(false); };
    $("#approval-accept").onclick = () => finish(true);
    $("#approval-decline").onclick = () => finish(false);
    dialog.addEventListener("cancel", cancel);
    signal?.addEventListener("abort", abort, {once: true});
    if (signal?.aborted) return finish(false);
    dialog.showModal();
  });
}

async function send() {
  const text = $("#input").value.trim();
  if (!text && !pending.length) return;
  if (agentOn && pending.length) { alert("Remove attached files before using Oreo Code."); return; }
  if (!state.has_key) {
    if (state.owner) return openSettings("Paste your ABB API key first (it starts with sk-).");
    return alert("Oreo isn't set up yet. Ask the owner to add an API key.");
  }
  const files = pending; pending = []; showTray();
  $("#input").value = ""; grow();
  const docs = files.filter(f => !f.url).map(f => f.name);
  const userEl = addMsg("user", text, null, files.filter(f => f.url).map(f => f.url));
  if (docs.length) userEl.insertAdjacentHTML("beforeend", `<div class="chips">attached ${docs.map(esc).join(", ")}</div>`);
  const el = addMsg("assistant", "");
  el.classList.add("streaming");
  const md = el.querySelector(".md");
  md.classList.add("streaming-plain");
  md.innerHTML = thinking(docs.length ? "reading " + (docs.length > 1 ? docs.length + " files" : "the file") : files.length ? "looking" : "thinking");
  const label = t => { const l = md.querySelector(".thinking .label"); if (l) l.textContent = t; };
  let q = 0;
  let quips = setInterval(() => label(QUIPS[++q % QUIPS.length]), 2200);
  const quiet = () => { clearInterval(quips); quips = null; };
  let sources = [];
  scrollDown();

  controller = new AbortController();
  setBusy(true);
  let reply = "", buf = "";
  const meta = (t, err) => { el.insertAdjacentHTML("beforeend", `<div class="meta${err ? " err" : ""}">${esc(t)}</div>`); };
  try {
    const r = await fetch(agentOn ? "/api/agent" : "/api/chat", {
      method: "POST", signal: controller.signal,
      headers: {...who(), "Content-Type": "application/json"},
      body: JSON.stringify({id: chatId, model: $("#model").value, text, web: webOn,
                            files: files.map(({name, type, data}) => ({name, type, data}))}),
    });
    if (!r.ok) throw new Error((await r.json()).error);
    const reader = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, cut); buf = buf.slice(cut + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.chat) {
          const isNew = chatId !== ev.chat;
          chatId = ev.chat; history.replaceState(null, "", "#" + chatId);
          if ((ev.attached || []).length) userEl.insertAdjacentHTML("beforeend", `<div class="chips">attached ${ev.attached.map(esc).join(", ")}</div>`);
          for (const e of ev.errors || []) userEl.insertAdjacentHTML("beforeend", `<div class="chips">${esc(e)}</div>`);
          if (isNew) loadChats();
        } else if (ev.status) {
          quiet(); label(ev.status);
        } else if (ev.sources) {
          sources = ev.sources;
        } else if (ev.tool) {
          const {name, args} = ev.tool;
          const target = args.path || args.command || "";
          meta(`${name.replaceAll("_", " ")}${target ? " · " + target : ""}`);
        } else if (ev.approval) {
          quiet();
          const a = ev.approval;
          const approved = await reviewAgentAction(a);
          await api("agent_decision", {method: "POST", body: {id: a.id, approved}});
        } else if (ev.tool_result) {
          meta((ev.tool_result.result || "complete").split("\n")[0]);
        } else if (ev.text !== undefined) {
          quiet();
          const stick = atBottom();
          if (!reply) { md.replaceChildren(); md.classList.add("streaming-plain"); }
          reply += ev.text; md.append(document.createTextNode(ev.text));
          if (stick) scrollDown();
        } else if (ev.done) {
          md.classList.remove("streaming-plain"); md.innerHTML = markdown(reply, sources); typesetMath(md);
          if (sources.length) el.insertAdjacentHTML("beforeend", sourcesHtml(sources));
          meta(ev.done);
        } else if (ev.error) {
          throw new Error(ev.error);
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") { if (!reply) el.remove(); else meta("stopped"); }
    else { if (!reply) md.innerHTML = ""; meta(e.message, true); }
  } finally {
    quiet();
    el.classList.remove("streaming");
    controller = null;
    setBusy(false);
    $("#input").focus();
  }
}

// ---------- settings

function fillModels(sel, value) {
  sel.innerHTML = Object.entries(state.models)
    .map(([short, id]) => `<option value="${esc(id)}">${esc(short)}</option>`).join("");
  sel.value = value;
}

function openSettings(msg = "") {
  const s = state.settings;
  $("#s-key").value = "";
  $("#s-key").placeholder = state.has_key ? "saved in Keychain · paste to replace" : "paste your key (sk-…)";
  fillModels($("#s-model"), s.model);
  $("#s-temp").value = s.temperature;
  $("#s-max").value = s.max_tokens;
  $("#s-ctx").value = s.context;
  $("#s-instr").value = s.instructions;
  $("#status").textContent = msg;
  $("#settings").showModal();
  loadUsage();
  if (!state.has_key) $("#s-key").focus();
}

async function saveSettings() {
  try {
    const key = $("#s-key").value.trim();
    if (key) { await api("key", {body: {key}}); }
    const prevDefault = state.settings.model;
    state = await api("settings", {body: {
      model: $("#s-model").value, temperature: +$("#s-temp").value,
      max_tokens: +$("#s-max").value, context: +$("#s-ctx").value, instructions: $("#s-instr").value,
    }});
    if ($("#model").value === prevDefault) $("#model").value = state.settings.model;
    $("#settings").close();
    loadUsage();
  } catch (e) { $("#status").textContent = e.message; }
}

async function loadUsage() {
  if (!state.has_key) { $("#usage").textContent = "no key yet"; $("#usage-detail").textContent = ""; return; }
  try {
    const d = await api("usage");
    $("#usage").textContent = `${d.percentage} used`;
    $("#usage-bar").style.width = Math.min(100, d.month_usage / d.month_limit * 100) + "%";
    $("#usage-detail").textContent = `${d.month_usage.toLocaleString()} of ${d.month_limit.toLocaleString()} tokens · ${(d.month_limit - d.month_usage).toLocaleString()} left`;
  } catch (e) { $("#usage").textContent = "couldn't load"; $("#usage-detail").textContent = e.message; }
}

// ---------- wiring

function grow() { const t = $("#input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; updateSend(); }

$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!controller) send(); }
});
$("#form").onsubmit = e => { e.preventDefault(); controller ? controller.abort() : send(); };
$("#new").onclick = newChat;
$("#attach").onclick = () => $("#pick").click();
let webOn = localStorage.getItem("oreo-web") !== "0";
const showWeb = () => {
  const button = $("#web");
  button.classList.toggle("on", webOn);
  button.textContent = `Web: ${webOn ? "On" : "Off"}`;
  button.setAttribute("aria-pressed", String(webOn));
  button.setAttribute("aria-label", `Web search ${webOn ? "on" : "off"}`);
  button.title = `Web search is ${webOn ? "on" : "off"}. Click to turn it ${webOn ? "off" : "on"}.`;
};
$("#web").onclick = () => { webOn = !webOn; localStorage.setItem("oreo-web", webOn ? "1" : "0"); showWeb(); };
showWeb();
let agentOn = false;
function setAgentMode(enabled) {
  agentOn = Boolean(enabled);
  $("#agent").classList.toggle("on", agentOn);
  $("#agent").setAttribute("aria-pressed", String(agentOn));
  $("#attach").disabled = $("#web").disabled = agentOn;
  $("#input").placeholder = agentOn ? "Ask Oreo Code to work on this project" : "Message Oreo";
  localStorage.setItem("oreo-code", agentOn ? "1" : "0");
}
$("#agent").onclick = () => {
  if (!agentOn && pending.length) { alert("Remove attached files before switching to Code mode."); return; }
  setAgentMode(!agentOn);
};
$("#pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#input").addEventListener("paste", e => {
  const fs = [...e.clipboardData.files];
  if (fs.length) { e.preventDefault(); addFiles(fs); }
});
let dragDepth = 0;
addEventListener("dragenter", e => { if (e.dataTransfer.types.includes("Files")) { dragDepth++; document.body.classList.add("drop"); } });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("drop"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("drop");
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
$("#open-settings").onclick = () => openSettings();
$("#s-close").onclick = () => $("#settings").close();
$("#s-save").onclick = saveSettings;
$("#s-test").onclick = async () => {
  $("#status").textContent = "testing…";
  try { $("#status").textContent = (await api("test", {body: {}})).message; }
  catch (e) { $("#status").textContent = "failed: " + e.message; }
};
$("#msgs").addEventListener("click", e => {
  if (e.target.matches("pre button")) {
    navigator.clipboard.writeText(e.target.previousElementSibling.textContent);
    e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy", 1200);
  }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); }
  if (e.key === "Escape" && controller) controller.abort();
});

function askName() {
  $("#hello-name").value = me;
  $("#hello").showModal();
  return new Promise(done => {
    $("#hello").addEventListener("close", function closed() {
      const name = $("#hello-name").value.trim().slice(0, 30);
      if (!name) { $("#hello").showModal(); return; }   // Esc doesn't skip it
      $("#hello").removeEventListener("close", closed);
      me = name;
      localStorage.setItem("oreo-name", me);
      $("#who").textContent = me;
      done();
    });
  });
}

$("#who").onclick = async () => { await askName(); newChat(); };

(async () => {
  if (!me) await askName();
  $("#who").textContent = me;
  state = await api("state");
  fillModels($("#model"), state.settings.model);
  $("#owner-only").hidden = $("#file-hint").hidden = !state.owner;
  $("#agent").hidden = !state.owner;
  if (state.workspace) $("#agent").title = `Code agent workspace: ${state.workspace}`;
  setAgentMode(state.owner && localStorage.getItem("oreo-code") === "1");
  const id = location.hash.slice(1);
  if (id) await openChat(id).catch(newChat); else newChat();
  updateSend();
  if (!state.has_key && state.owner) openSettings("Welcome to Oreo. Paste your ABB API key to get started.");
})();
</script>
