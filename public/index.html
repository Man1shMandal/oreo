<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oreo</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #111; color: #f3f0e8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 32px)); }
      h1 { font-size: clamp(3rem, 12vw, 6rem); margin: 0; letter-spacing: -.1em; }
      p { color: #a9a59c; line-height: 1.6; }
      #chat, #auth { margin-top: 32px; }
      textarea, input { box-sizing: border-box; width: 100%; border: 1px solid #4a4740; background: #191816; color: inherit; padding: 14px; font: inherit; border-radius: 8px; }
      textarea { min-height: 110px; resize: vertical; }
      button { margin-top: 10px; border: 1px solid #f3f0e8; border-radius: 999px; background: #f3f0e8; color: #111; padding: 10px 18px; font: inherit; cursor: pointer; }
      button.secondary { background: transparent; color: inherit; border-color: #4a4740; margin-left: 6px; }
      #answer { white-space: pre-wrap; line-height: 1.7; margin-top: 26px; }
      #status { min-height: 1.5em; color: #a9a59c; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>oreo</h1>
      <p>A small personal AI by Manish.</p>
      <section id="auth">
        <p>Sign in with Google. New accounts need approval before they can use OREO.</p>
        <button id="google">continue with Google</button>
      </section>
      <p id="status"></p>
      <section id="chat" class="hidden">
        <p id="who"></p>
        <textarea id="message" placeholder="Ask Oreo anything"></textarea>
        <button id="send">send</button><button id="sign-out" class="secondary">sign out</button>
        <div id="answer"></div>
      </section>
    </main>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
      const auth = document.querySelector('#auth'), chat = document.querySelector('#chat');
      const status = document.querySelector('#status'), answer = document.querySelector('#answer');
      let supabase;
      try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Oreo could not load its sign-in settings.');
        const config = await response.json();
        if (!config.supabaseUrl || !config.supabasePublishableKey) throw new Error('Oreo sign-in is not configured yet.');
        supabase = createClient(config.supabaseUrl, config.supabasePublishableKey);
      } catch (error) {
        status.textContent = error.message;
        document.querySelector('#google').disabled = true;
        throw error;
      }
      const callbackError = new URLSearchParams(window.location.hash.slice(1)).get('error_description')
        || new URLSearchParams(window.location.search).get('error_description');
      if (callbackError) {
        status.textContent = callbackError;
        history.replaceState(null, '', window.location.pathname);
      }
      const show = session => {
        auth.classList.toggle('hidden', !!session); chat.classList.toggle('hidden', !session);
        document.querySelector('#who').textContent = session ? session.user.email : '';
      };
      const session = (await supabase.auth.getSession()).data.session; show(session);
      supabase.auth.onAuthStateChange((_event, next) => show(next));
      document.querySelector('#google').onclick = async () => {
        status.textContent = 'Opening Google…';
        const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
        if (error) status.textContent = error.message;
      };
      document.querySelector('#sign-out').onclick = () => supabase.auth.signOut();
      document.querySelector('#send').onclick = async () => {
        const message = document.querySelector('#message').value.trim(); if (!message) return;
        const send = document.querySelector('#send');
        send.disabled = true;
        status.textContent = 'thinking…'; answer.textContent = '';
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (!session) throw new Error('Please sign in again.');
          const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ message }) });
          const data = await response.json();
          if (!response.ok || data.error) throw new Error(data.error || 'Oreo could not answer. Try again shortly.');
          if (typeof data.reply !== 'string') throw new Error('Oreo returned an unexpected response.');
          status.textContent = ''; answer.textContent = data.reply;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          send.disabled = false;
        }
      };
    </script>
  </body>
</html>
