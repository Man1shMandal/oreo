<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171717">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Oreo">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Oreo</title>
    <link rel="icon" type="image/svg+xml" href="/oreo.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      :root{color-scheme:dark;--bg:#171717;--side:#111;--panel:#222;--line:#303030;--ink:#eee;--muted:#999;--accent:#e5e1d8;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
      *{box-sizing:border-box}body{margin:0;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;grid-template-columns:270px minmax(0,1fr);overflow:hidden}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.hidden{display:none!important}
      aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;min-height:0}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;padding:7px 10px 22px}.brand i{display:block;width:13px;height:13px;background:var(--accent);border-radius:50% 50% 45% 45%;box-shadow:inset -3px -2px #0002}.new{border:1px solid #414141;background:transparent;border-radius:10px;padding:10px 12px;text-align:left}.new:hover,.history button:hover{background:#262626}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#777;padding:23px 10px 8px}.history{overflow:auto;flex:1}.history button{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}.history button.active{background:#29252e;color:#fff}.side-foot{border-top:1px solid var(--line);padding:12px 8px 2px;display:flex;align-items:center;gap:9px;min-width:0}.side-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--muted);font-size:12px}.quiet{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:8px}.quiet:hover{background:#292929;color:var(--ink)}
      main{min-width:0;min-height:0;display:flex;flex-direction:column}.topbar{height:58px;flex:none;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.topbar strong{font-size:14px;font-weight:550}.top-actions{display:flex;gap:8px;align-items:center}.usage{color:var(--muted);font-size:12px}.stage{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}.timeline{width:min(820px,calc(100% - 40px));margin:0 auto;padding:32px 0 48px}.welcome{min-height:min(55vh,520px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:20px}.welcome h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.045em;font-weight:550;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.turn{margin:0 0 28px}.user{margin-left:auto;width:fit-content;max-width:85%;padding:12px 16px;background:#2a2a2a;border-radius:18px 18px 5px 18px;white-space:pre-wrap;overflow-wrap:anywhere}.assistant{max-width:100%;padding:5px 2px 2px;line-height:1.72;overflow-wrap:anywhere}.assistant p{margin:.5em 0 1em}.assistant h1,.assistant h2,.assistant h3{line-height:1.25;margin:1.3em 0 .55em}.assistant ul,.assistant ol{padding-left:1.5em}.assistant a{color:#c6a0ed}.assistant pre{position:relative;overflow:auto;background:#101010;border:1px solid var(--line);border-radius:10px;padding:16px}.assistant code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}.assistant :not(pre)>code{background:#292929;padding:.15em .35em;border-radius:5px}.copy{position:absolute;right:8px;top:8px;border:1px solid #444;background:#222;border-radius:6px;padding:4px 8px;font-size:12px}.sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sources a{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;text-decoration:none}.status{color:var(--muted);font-size:12px;min-height:22px}.compose-wrap{flex:none;padding:0 20px 16px}.compose{width:min(820px,100%);margin:auto}.box{border:1px solid #414141;background:#222;border-radius:18px;padding:12px 14px 10px;box-shadow:none}.box:focus-within{border-color:#696071}.box textarea{display:block;width:100%;min-height:52px;max-height:220px;resize:none;border:0;outline:0;background:transparent;padding:8px 4px;line-height:1.5}.box-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:6px}.box-tools{display:flex;gap:6px}.tool{border:1px solid transparent;background:transparent;color:#bbb;border-radius:9px;padding:6px 9px;font-size:13px}.tool:hover,.tool.on{background:#343039;color:var(--accent)}.send{border:0;border-radius:50%;width:36px;height:36px;background:var(--accent);color:#18141b;font-size:20px;font-weight:600}.hint{text-align:center;color:#777;font-size:11px;padding-top:8px}.signin{margin:auto;width:min(420px,calc(100% - 36px));padding:34px;border:1px solid var(--line);background:#1d1d1d;border-radius:18px}.signin h1{font-size:34px;margin:0;letter-spacing:-.04em}.signin p{color:var(--muted);margin:8px 0 24px}.primary{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#1a1520;font-weight:600}.mobile-head{display:none}
      .mobile-menu{display:none}#model{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 9px;border-radius:8px}#tray{display:flex;gap:8px;flex-wrap:wrap}.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:8px;max-width:220px;font-size:12px;color:#ccc}.file img{width:30px;height:30px;object-fit:cover;border-radius:5px}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file button{border:0;background:none;color:#999}.sources a:hover{background:#302a37}
      @media(max-width:760px){body{grid-template-columns:1fr}aside{display:none}body.drawer aside{display:flex;position:fixed;z-index:5;inset:0 20% 0 0;box-shadow:20px 0 50px #0008;padding:calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}main{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}.topbar{height:52px;padding:0 14px}.mobile-head{display:block}.mobile-menu{display:inline-block}.timeline{width:calc(100% - 28px);padding-top:18px}.compose-wrap{padding:0 10px 10px}.user{max-width:92%}.welcome{min-height:44vh;padding:12px}.usage{max-width:135px;text-align:right}}
      body.signed-out{grid-template-columns:1fr}body.signed-out aside,body.signed-out .topbar{display:none}.signin{border:0;background:transparent;text-align:center;max-width:460px}.signin h1{font-size:56px;font-weight:550}.signin .primary{width:100%;margin-top:12px}.assistant table{border-collapse:collapse;display:block;overflow:auto;margin:16px 0}.assistant th,.assistant td{border:1px solid var(--line);padding:8px 12px;text-align:left}.assistant blockquote{border-left:2px solid #777;padding-left:16px;margin-left:0;color:#bbb}.attachment-chip{font-size:12px;border:1px solid #555;border-radius:6px;padding:4px 8px;margin-top:8px;display:inline-block}.user img{max-width:240px;max-height:180px;border-radius:8px;display:block;margin-top:8px}.assistant .meta{font-size:11px;color:var(--muted);margin-top:10px}.assistant.streaming:after{content:' ';display:inline-block;width:6px;height:14px;background:var(--accent)}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.stage{scroll-behavior:auto}.status{width:min(820px,100%);margin:0 auto;padding:4px 0}.history button:disabled{opacity:.7}.side-foot span{font-size:11px}.usage{max-width:150px}#usage{cursor:help}.box{border-color:#444}.tool.on{border-color:#666;background:#303030}.signin p{font-size:16px}.signin small{display:block;color:#777;margin-top:24px}.signin #auth-status{min-height:24px;color:#aaa;margin-top:16px;font-size:13px}.mobile-backdrop{display:none}@media(max-width:760px){body.drawer .mobile-backdrop{display:block;position:fixed;inset:0;background:#0007;z-index:4;border:0}.top-actions{gap:6px}.topbar #model{max-width:140px}#chat-title{display:none}.usage{font-size:10px;max-width:90px}.signin{padding:22px}.signin h1{font-size:46px}.box textarea{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(max-height:500px){.hint{display:none}.topbar{height:44px}.timeline{padding-top:12px}.box{padding:6px 10px}.box textarea{min-height:36px;max-height:96px;padding:4px}.box-bottom{padding-top:0}.compose-wrap{padding-bottom:6px}}
      #usage{position:relative;display:block;width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:conic-gradient(var(--accent) var(--allowance,0deg),#3a3a3a 0);cursor:help}#usage:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
      .brand{letter-spacing:-.035em;font-weight:650}.brand img{display:block}.signin .wordmark{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:650;letter-spacing:-.035em}.mobile-head img{display:block}@media(max-width:760px){.topbar .mobile-head{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:650;letter-spacing:-.035em}.signin .wordmark img{width:46px;height:46px}}
    </style>
  </head>
  <body class="signed-out"><button class="mobile-backdrop" aria-label="Close chats"></button>
    <aside><div class="brand"><img src="/oreo.svg" alt="" width="24" height="24">oreo</div><button id="new-chat" class="new">＋ New chat</button><div class="side-label">Your chats</div><nav id="history" class="history"></nav><div class="side-foot"><span id="who"></span><button id="install" class="quiet hidden" title="Install Oreo as an app">Install</button><button id="refresh" class="quiet" title="Refresh usage">↻</button><button id="sign-out" class="quiet" title="Sign out">Sign out</button></div></aside>
    <main><header class="topbar"><button id="mobile-menu" class="quiet mobile-menu" aria-label="Open chats">☰</button><strong class="mobile-head"><img src="/oreo.svg" alt="" width="22" height="22">oreo</strong><strong id="chat-title">New chat</strong><div class="top-actions"><select id="model" aria-label="Model" title="Model for this chat"></select><span id="usage" class="usage"></span></div></header><section id="auth" class="signin"><h1 class="wordmark"><img src="/oreo.svg" alt="" width="56" height="56">oreo</h1><p>A small personal AI.<br>Ask, explore, and work with your files.</p><button id="google" class="primary">Continue with Google</button><div id="auth-status" role="status">Loading…</div><small>Your conversations stay in your account.</small></section><section id="chat" class="stage hidden"><div id="answer" class="timeline" aria-live="polite"><div class="welcome"><h1>What are we working on?</h1><p>Ask a question, share an idea, or start with a file.</p></div></div></section><div class="compose-wrap hidden"><div id="status" class="status" role="status"></div><form id="composer" class="compose"><div class="box"><div id="tray"></div><textarea id="message" maxlength="6000" aria-label="Message" placeholder="Message Oreo" rows="1"></textarea><div class="box-bottom"><div class="box-tools"><button id="attach" type="button" class="tool" title="Attach a PDF, document, image, or text file">＋ Attach</button><button id="web" type="button" class="tool" title="Search the web while answering">◎ Web</button><input id="pick" type="file" multiple hidden accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.log,.c,.cpp,.h,.java,.go,.rs,.sh,.sql"></div><button id="send" type="button" class="send" aria-label="Send">↑</button></div></div><div class="hint">Enter to send · Shift + Enter for a new line</div></form></div></main>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
