<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oreo</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #111; color: #f3f0e8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 32px)); }
      h1 { font-size: clamp(3rem, 12vw, 6rem); margin: 0; letter-spacing: -.1em; }
      p { color: #a9a59c; line-height: 1.6; }
      #chat, #auth { margin-top: 32px; }
      textarea, input { box-sizing: border-box; width: 100%; border: 1px solid #4a4740; background: #191816; color: inherit; padding: 14px; font: inherit; border-radius: 8px; }
      textarea { min-height: 110px; resize: vertical; }
      button:disabled { opacity: .5; cursor: default; }
      #admin { margin-top: 32px; border-top: 1px solid #4a4740; padding-top: 16px; }
      .account-row { padding: 12px 0; border-bottom: 1px solid #333; overflow-wrap: anywhere; }
      .account-row input { width: 130px; padding: 8px; }
      #usage { font-size: .85rem; }
      button { margin-top: 10px; border: 1px solid #f3f0e8; border-radius: 999px; background: #f3f0e8; color: #111; padding: 10px 18px; font: inherit; cursor: pointer; }
      button.secondary { background: transparent; color: inherit; border-color: #4a4740; margin-left: 6px; }
      #answer { white-space: pre-wrap; line-height: 1.7; margin-top: 26px; }
      #status { min-height: 1.5em; color: #a9a59c; }
      .hidden { display: none; }
      select { max-width: 100%; padding: 8px; background: #191816; color: inherit; border: 1px solid #4a4740; border-radius: 8px; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>oreo</h1>
      <p>A small personal AI.</p>
      <section id="auth">
        <p>Sign in with Google. New accounts need approval before they can use OREO.</p>
        <button id="google">continue with Google</button>
      </section>
      <p id="status" role="status"></p>
      <section id="chat" class="hidden">
        <p id="who"></p>
        <p id="usage"></p><button id="refresh" class="secondary">refresh account</button>
        <label for="history">Conversation</label>
        <select id="history"><option value="">New chat</option></select>
        <button id="new-chat" class="secondary">new chat</button>
        <textarea id="message" maxlength="6000" aria-label="Message" placeholder="Ask Oreo anything"></textarea>
        <button id="send">send</button><button id="sign-out" class="secondary">sign out</button>
        <div id="answer" aria-live="polite"></div>
        <section id="admin" class="hidden"><h2>Accounts</h2><button id="refresh-admin" class="secondary">refresh accounts</button><p id="admin-status" role="status"></p><div id="users"></div></section>
      </section>
    </main>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
      const $ = selector => document.querySelector(selector);
      const auth = $('#auth'), chat = $('#chat'), status = $('#status'), answer = $('#answer');
      const historySelect = $('#history'), composer = $('#message');
      let supabase, activeConversation = null, activeUser = null, sending = false, historyVersion = 0;
      let approved = false, remaining = 0, accountVersion = 0, loadingConversation = false;
      const updateControls = () => {
        $('#send').disabled = sending || loadingConversation || !approved || remaining <= 0;
        composer.disabled = sending || loadingConversation || !approved || remaining <= 0;
        historySelect.disabled = sending || !approved;
        $('#new-chat').disabled = sending || !approved;
      };
      const api = async (path, options = {}) => {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) throw new Error('Please sign in again.');
        const response = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, ...options.headers } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) throw new Error(data.error || 'Oreo could not complete this request. Please retry.');
        return data;
      };
      const renderHistory = rows => {
        answer.textContent = rows.map(row => `${row.role === 'user' ? 'You' : 'Oreo'}\n${row.content}`).join('\n\n');
      };
      const loadConversations = async () => {
        const user = activeUser, version = ++historyVersion;
        const data = await api('/api/conversations');
        if (user !== activeUser || version !== historyVersion) return;
        historySelect.replaceChildren(new Option('New chat', ''));
        for (const row of data.conversations) historySelect.add(new Option(row.title, row.id));
        historySelect.value = activeConversation || '';
      };
      const loadAdmin = async () => {
        const user = activeUser;
        $('#admin-status').textContent = 'Loading accounts…';
        try {
          const data = await api('/api/admin');
          if (user !== activeUser) return;
          $('#users').replaceChildren();
          for (const account of data.users) {
            const row = document.createElement('div'); row.className = 'account-row';
            const email = document.createElement('p'); email.textContent = `${account.email} · ${account.approved ? 'approved' : 'pending'}`;
            const limit = document.createElement('input'); limit.type = 'number'; limit.min = '1'; limit.max = '1000000'; limit.step = '1'; limit.value = account.daily_token_limit;
            limit.setAttribute('aria-label', `Daily token limit for ${account.email}`);
            const action = document.createElement('button'); action.className = 'secondary'; action.textContent = account.approved ? 'revoke access' : 'approve';
            const save = document.createElement('button'); save.className = 'secondary'; save.textContent = 'save limit';
            const update = async nextApproved => {
              if (!limit.checkValidity()) { limit.reportValidity(); return; }
              action.disabled = save.disabled = true;
              try {
                await api('/api/admin', { method: 'POST', body: JSON.stringify({ user_id: account.id, approved: nextApproved, daily_token_limit: Number(limit.value) }) });
                if (user !== activeUser) return;
                await loadAdmin(); await loadAccount();
              } catch (error) { if (user === activeUser) $('#admin-status').textContent = error.message; }
              finally { action.disabled = save.disabled = false; }
            };
            action.onclick = () => update(!account.approved); save.onclick = () => update(account.approved);
            row.append(email, limit, save, action); $('#users').append(row);
          }
          $('#admin-status').textContent = data.users.length ? 'Daily limits use estimated tokens and reset at midnight UTC.' : 'No accounts yet.';
        } catch (error) { if (user === activeUser) $('#admin-status').textContent = error.message; }
      };
      const loadAccount = async () => {
        const user = activeUser, version = ++accountVersion;
        try {
          const data = await api('/api/profile');
          if (user !== activeUser || version !== accountVersion) return;
          approved = !!data.profile.approved; remaining = data.usage.remaining;
          $('#usage').textContent = approved ? `${remaining.toLocaleString()} of ${data.profile.daily_token_limit.toLocaleString()} estimated tokens left today · resets at midnight UTC` : 'Your account is waiting for approval. Refresh after your account is approved.';
          const showAccounts = data.admin && $('#admin').classList.contains('hidden');
          $('#admin').classList.toggle('hidden', !data.admin);
          if (showAccounts) void loadAdmin();
          if (!approved) status.textContent = 'Your account is waiting for approval.';
          else if (remaining <= 0) status.textContent = 'Your daily limit is reached. Please return after midnight UTC.';
          else status.textContent = '';
          updateControls();
          if (approved) await loadConversations();
        } catch (error) { if (user === activeUser) { status.textContent = error.message; updateControls(); } }
      };
      try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Oreo could not load its sign-in settings.');
        const config = await response.json();
        if (!config.supabaseUrl || !config.supabasePublishableKey) throw new Error('Oreo sign-in is not configured yet.');
        supabase = createClient(config.supabaseUrl, config.supabasePublishableKey);
      } catch (error) {
        status.textContent = error.message; $('#google').disabled = true; throw error;
      }
      const callbackError = new URLSearchParams(window.location.hash.slice(1)).get('error_description') || new URLSearchParams(window.location.search).get('error_description');
      if (callbackError) { status.textContent = callbackError; history.replaceState(null, '', window.location.pathname); }
      const show = session => {
        auth.classList.toggle('hidden', !!session); chat.classList.toggle('hidden', !session);
        $('#who').textContent = session ? session.user.email : '';
        const user = session?.user.id || null;
        if (user !== activeUser) {
          activeUser = user; activeConversation = null; ++historyVersion; ++accountVersion;
          approved = false; remaining = 0; loadingConversation = false; answer.textContent = ''; composer.value = ''; $('#usage').textContent = '';
          $('#users').replaceChildren(); $('#admin-status').textContent = ''; $('#admin').classList.add('hidden');
          historySelect.replaceChildren(new Option('New chat', '')); updateControls();
          if (user) setTimeout(() => { void loadAccount(); }, 0);
          else if (!callbackError) status.textContent = '';
        }
      };
      show((await supabase.auth.getSession()).data.session);
      supabase.auth.onAuthStateChange((_event, next) => show(next));
      $('#google').onclick = async () => {
        status.textContent = 'Opening Google…';
        const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
        if (error) status.textContent = error.message;
      };
      $('#sign-out').onclick = async () => {
        const { error } = await supabase.auth.signOut();
        if (error) status.textContent = error.message; else show(null);
      };
      $('#refresh').onclick = () => { void loadAccount(); };
      $('#refresh-admin').onclick = () => { void loadAdmin(); };
      $('#new-chat').onclick = () => {
        if (sending) return;
        ++historyVersion; loadingConversation = false; updateControls(); activeConversation = null; historySelect.value = ''; answer.textContent = ''; composer.value = ''; status.textContent = ''; composer.focus();
      };
      historySelect.onchange = async () => {
        const selected = historySelect.value || null, user = activeUser, version = ++historyVersion;
        activeConversation = selected; answer.textContent = ''; loadingConversation = !!selected; updateControls();
        if (!selected) return;
        status.textContent = 'Loading chat…';
        try {
          const data = await api(`/api/conversations?id=${encodeURIComponent(selected)}`);
          if (user !== activeUser || version !== historyVersion) return;
          renderHistory(data.messages); status.textContent = '';
        } catch (error) { if (user === activeUser && version === historyVersion) status.textContent = error.message; }
        finally { if (user === activeUser && version === historyVersion) { loadingConversation = false; updateControls(); } }
      };
      $('#send').onclick = async () => {
        const message = composer.value.trim(); if (!message || sending || loadingConversation || !approved || remaining <= 0) return;
        sending = true; updateControls();
        const user = activeUser; ++historyVersion; status.textContent = 'Thinking…';
        try {
          const data = await api('/api/chat', { method: 'POST', body: JSON.stringify({ message, conversation_id: activeConversation }) });
          if (user !== activeUser) return;
          if (typeof data.reply !== 'string') throw new Error('Oreo returned an unexpected response.');
          activeConversation = data.conversation_id;
          answer.textContent += `${answer.textContent ? '\n\n' : ''}You\n${message}\n\nOreo\n${data.reply}`;
          composer.value = ''; status.textContent = ''; await loadAccount();
        } catch (error) {
          if (user === activeUser) { await loadAccount(); status.textContent = error.message; }
        } finally { sending = false; updateControls(); if (user === activeUser && approved && remaining > 0) composer.focus(); }
      };
    </script>
  </body>
</html>
